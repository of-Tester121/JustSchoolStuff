<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blank</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bf0'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#eef0f6; --panel:#fff; --text:#13141b; --muted:#6a6e80; --line:#d9dce8;
    --accent:#5b5bf0; --accent-ink:#fff; --field:#f5f6fb; --ok:#1f9d55; --bad:#d6403f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d0e14; --panel:#171821; --text:#eef0f8; --muted:#8e92a6; --line:#2a2c3a;
      --accent:#7a7aff; --accent-ink:#0d0e14; --field:#101119; --ok:#46c17c; --bad:#ff6b6a; color-scheme: dark; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center; padding:min(14vh,120px) 20px 40px; }
  main { width:100%; max-width:560px; }
  h1 { font-size:clamp(34px,8vw,52px); letter-spacing:-.03em; margin:0 0 8px; font-weight:700; }
  .sub { margin:0 0 26px; color:var(--muted); font-size:15px; line-height:1.5; }
  .bar { display:flex; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px; }
  .bar:focus-within { border-color:var(--accent); }
  .bar input { flex:1; min-width:0; border:0; background:transparent; color:var(--text); font-size:17px; padding:10px 12px; outline:none; }
  button { font:inherit; cursor:pointer; }
  .go { background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px; padding:0 22px; font-weight:600; font-size:15px; }
  .go:disabled { opacity:.5; cursor:wait; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0; }
  .chip { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:6px 14px; font-size:13px; }
  .chip:hover { color:var(--text); border-color:var(--muted); }
  .opts { margin-top:28px; border-top:1px solid var(--line); padding-top:20px; display:grid; gap:14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:14px; font-size:14px; }
  .row > span { color:var(--muted); }
  select, .row input[type=text] { background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; max-width:230px; width:100%; }
  .row input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
  #status { margin-top:22px; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; min-height:20px; }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  #status.ok #dot { background:var(--ok); } #status.bad #dot { background:var(--bad); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Blank</h1>
  <p class="sub">Type a site or a search. It opens in an about:blank tab, so the address bar never shows where you went.</p>

  <div class="bar">
    <input id="url" type="text" placeholder="ixl.com or search anything" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <button id="go" class="go" disabled>Launch</button>
  </div>

  <div class="chips" id="chips">
    <button class="chip" data-url="ixl.com">IXL</button>
    <button class="chip" data-url="google.com">Google</button>
    <button class="chip" data-url="youtube.com">YouTube</button>
    <button class="chip" data-url="wikipedia.org">Wikipedia</button>
  </div>

  <div class="opts">
    <div class="row"><span>Open in about:blank</span><input id="cloak" type="checkbox" checked></div>
    <div class="row"><span>Send this tab to Google after launch</span><input id="redir" type="checkbox"></div>
    <div class="row"><span>Tab disguise</span>
      <select id="disguise">
        <option value="">None (keep default)</option>
        <option value="Google Docs|docs.google.com">Google Docs</option>
        <option value="Google Drive|drive.google.com">Google Drive</option>
        <option value="Google Classroom|classroom.google.com">Google Classroom</option>
        <option value="Canvas|instructure.com">Canvas</option>
        <option value="custom">Custom…</option>
      </select></div>
    <div class="row" id="customRow" hidden><span>Custom title</span><input id="customTitle" type="text" placeholder="My Notes"></div>
    <div class="row"><span>Connection</span>
      <select id="transport">
        <option value="epoxy">Epoxy (default)</option>
        <option value="libcurl">Libcurl (backup)</option>
      </select></div>
  </div>

  <div id="status"><span id="dot"></span><span id="statusText">Starting proxy…</span></div>
</main>

<script src="/baremux/index.js"></script>
<script src="/uv/uv.bundle.js"></script>
<script src="/uv.config.js"></script>
<script src="/app.js"></script>
</body>
</html>
